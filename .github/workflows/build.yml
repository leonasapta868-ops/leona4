name: Build leona4 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-leona4:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "leona4.cpp" -o "leona4.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-leona4
          path: "leona4.exe"
